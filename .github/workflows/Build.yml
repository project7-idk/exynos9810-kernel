name: Apollo Kernel Build

on:
  workflow_dispatch:
    inputs:
      devices:
        description: "Comma-separated devices to build: starlte,star2lte,crownlte"
        required: true
        default: "starlte,star2lte,crownlte"
      compiler:
        description: "Compiler (3=clang18, 7=clang20)"
        required: true
        default: "3"
      clean:
        description: "Clean build? (y/n)"
        required: true
        default: "n"
      selinux:
        description: "SELinux mode (1=permissive, 2=enforcing)"
        required: true
        default: "2"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        device: [starlte, star2lte, crownlte]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential curl flex git \
            libssl-dev libelf-dev dwarves unzip zip zstd wget cpio \
            python3 python-is-python3

      - name: Filter selected devices
        id: filter
        run: |
          SELECTED="${{ github.event.inputs.devices }}"
          if [[ ! "$SELECTED" =~ "${{ matrix.device }}" ]]; then
            echo "Skipping ${{ matrix.device }}"
            exit 78  # skipped job
          fi

      - name: Make script executable
        run: chmod +x apollo.sh

      - name: Build kernel
        env:
          CR_COMPILER: ${{ github.event.inputs.compiler }}
          CR_CLEAN: ${{ github.event.inputs.clean }}
          CR_SELINUX: ${{ github.event.inputs.selinux }}
          CR_KSU: "y"
        run: |
          # Map device to CR_TARGET
          case "${{ matrix.device }}" in
            starlte) CR_TARGET=1 ;;
            star2lte) CR_TARGET=2 ;;
            crownlte) CR_TARGET=3 ;;
          esac

          echo "Building ${{ matrix.device }} (CR_TARGET=$CR_TARGET)"
          ./apollo.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Apollo-${{ matrix.device }}-clang${{ github.event.inputs.compiler }}-clean${{ github.event.inputs.clean }}-selinux${{ github.event.inputs.selinux }}
          path: |
            Apollo/Out/*.img
            Apollo/Product/*.img
