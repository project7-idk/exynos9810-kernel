name: Apollo Kernel Build

on:
  workflow_dispatch:
    inputs:
      compiler:
        description: "Compiler"
        required: true
        default: "3"
        type: choice
        options:
          - "3"   # clang 18
          - "7"   # clang 20

      clean:
        description: "Clean build?"
        required: true
        default: "n"
        type: choice
        options:
          - "y"
          - "n"

      selinux:
        description: "SELinux mode"
        required: true
        default: "2"
        type: choice
        options:
          - "1"   # permissive
          - "2"   # enforcing

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    strategy:
      fail-fast: false
      matrix:
        device:
          - { name: starlte,    target: 1 }
          - { name: star2lte,   target: 2 }
          - { name: crownlte,   target: 3 }

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential curl flex git \
            libssl-dev libelf-dev dwarves \
            unzip zip zstd wget cpio \
            python3 python-is-python3

      - name: Make script executable
        run: chmod +x apollo.sh

      - name: Build kernel
        env:
          CR_TARGET:   ${{ matrix.device.target }}
          CR_COMPILER: ${{ inputs.compiler }}
          CR_CLEAN:    ${{ inputs.clean }}
          CR_SELINUX:  ${{ inputs.selinux }}
          CR_KSU:      "y"
        run: |
          echo "Device   : ${{ matrix.device.name }}"
          echo "Compiler : $CR_COMPILER"
          echo "Clean    : $CR_CLEAN"
          echo "SELinux  : $CR_SELINUX"
          ./apollo.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Apollo-${{ matrix.device.name }}-clang${{ inputs.compiler }}-clean${{ inputs.clean }}-selinux${{ inputs.selinux }}
          path: |
            Apollo/Out/*.img
            Apollo/Product/*.img
