name: Apollo Kernel Build - Starlte Clean Permissive

on:
  workflow_dispatch:  # manual trigger

jobs:
  build-starlte-clean:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential curl flex git \
            libssl-dev libelf-dev dwarves unzip zip zstd wget cpio \
            python3 python-is-python3

      - name: Make script executable
        run: chmod +x apollo.sh

      - name: Build starlte kernel
        run: |
          # Device and build config
          CR_TARGET=1          # starlte
          CR_COMPILER=3        # clang 18
          CR_CLEAN=y           # clean build
          CR_SELINUX=1         # permissive
          CR_KSU=n             # no KernelSU

          echo "Building Starlte kernel"
          ./apollo.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Apollo-Starlte-Clean-Permissive
          path: |
            Apollo/Out/*.img
            Apollo/Product/*.img
