name: Apollo Kernel Build

on:
  workflow_dispatch:
    inputs:
      devices:
        description: "Select devices to build (comma separated, e.g., starlte,star2lte)"
        required: true
        default: "starlte,star2lte,crownlte"
      compiler:
        description: "Compiler"
        required: true
        default: "3"
        type: choice
        options:
          - "3"   # clang 18
          - "7"   # clang 20
      clean:
        description: "Clean build?"
        required: true
        default: "n"
        type: choice
        options:
          - "y"
          - "n"
      selinux:
        description: "SELinux mode"
        required: true
        default: "2"
        type: choice
        options:
          - "1"   # permissive
          - "2"   # enforcing

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        device: [starlte, star2lte, crownlte, starltekor, star2ltekor, crownltekor]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential curl flex git \
            libssl-dev libelf-dev dwarves \
            unzip zip zstd wget cpio \
            python3 python-is-python3

      - name: Filter selected devices
        id: filter
        run: |
          SELECTED="${{ github.event.inputs.devices }}"
          echo "Selected devices: $SELECTED"
          if [[ ! "$SELECTED" =~ "${{ matrix.device }}" ]]; then
            echo "Skipping ${{ matrix.device }}"
            exit 78  # GitHub skips the job gracefully
          fi

      - name: Make script executable
        run: chmod +x apollo.sh
        
      - name: Build kernel
        env:
          CR_COMPILER: ${{ github.event.inputs.compiler }}
          CR_CLEAN: ${{ github.event.inputs.clean }}
          CR_SELINUX: ${{ github.event.inputs.selinux }}
          CR_KSU: "y"
        run: |
          # Map device name to CR_TARGET
          if [ "${{ matrix.device }}" = "starlte" ]; then CR_TARGET=1; fi
          if [ "${{ matrix.device }}" = "star2lte" ]; then CR_TARGET=2; fi
          if [ "${{ matrix.device }}" = "crownlte" ]; then CR_TARGET=3; fi
          if [ "${{ matrix.device }}" = "starltekor" ]; then CR_TARGET=4; fi
          if [ "${{ matrix.device }}" = "star2ltekor" ]; then CR_TARGET=5; fi
          if [ "${{ matrix.device }}" = "crownltekor" ]; then CR_TARGET=6; fi

          echo "Building ${{ matrix.device }} (CR_TARGET=$CR_TARGET)"
          ./apollo.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Apollo-${{ matrix.device }}-clang${{ github.event.inputs.compiler }}-clean${{ github.event.inputs.clean }}-selinux${{ github.event.inputs.selinux }}
          path: |
            Apollo/Out/*.img
            Apollo/Product/*.img
